# ==========================================
# 1. WORKER SETTINGS
# ==========================================

worker_processes auto;

events {
    worker_connections 1024;
}

# ==========================================
# 2. HTTP SETTINGS
# ==========================================

http {

    include mime.types;

    default_type application/octet-stream;

    # Logs
    access_log logs/access.log;
    error_log logs/error.log warn;

    # Connection settings
    sendfile on;
    keepalive_timeout 65;


    # ======================================
    # 3. RATE LIMITING
    # ======================================

    # Authentication: 5 requests per second
    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=5r/s;

    # General APIs: 10 requests per second
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;


    # ======================================
    # 4. IDENTITY SERVICE (port 4001)
    # ======================================

    upstream identity_service {

        server 127.0.0.1:4001;

        keepalive 16;
    }


    # ======================================
    # 5. RIDE-SHARE SERVICE (port 4002)
    #    publish route + search rides
    # ======================================

    upstream rideShare_service {

        server 127.0.0.1:4002;

        keepalive 16;
    }


    # ======================================
    # 6. NGINX SERVER
    # ======================================

    server {

        listen 8080;
        listen [::]:8080;   # IPv6, so http://localhost:8080 works on Windows

        server_name localhost;


        # ==================================
        # HEALTH CHECKS
        # ==================================

        location = /identity/health {

            proxy_pass http://identity_service/health;

            include proxy_headers.conf;
        }

        location = /rideshare/health {

            proxy_pass http://rideShare_service/health;

            include proxy_headers.conf;
        }


        # ==================================
        # IDENTITY SERVICE
        # ==================================

        # Authentication routes
        location /api/auth/ {

            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }

        # User profile
        location = /me {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }

        # Vehicle routes
        location /api/vehicles/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }

        # Driver routes
        location /api/drivers/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }


        # ==================================
        # RIDE-SHARE SERVICE
        #
        #   POST /api/v1/route-matching/publish   (driver publishes a route)
        #   POST /api/v1/route-matching/search    (passenger searches rides)
        # ==================================

        location /api/v1/route-matching/ {

            limit_req zone=api_limit burst=20 nodelay;

            # Published routes contain every OSRM point, so allow bigger bodies
            # (the backend accepts up to 2 MB).
            client_max_body_size 2m;

            proxy_pass http://rideShare_service;

            include proxy_headers.conf;
        }


        # ==================================
        # ROOT
        # ==================================

        location = / {

            return 200 "Share-Ride API Gateway is running";
        }

    }
}