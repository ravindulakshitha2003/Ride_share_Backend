
# ==========================================
# 1. WORKER SETTINGS
# ==========================================

worker_processes auto;

events {
    worker_connections 1024;
}

# ==========================================
# 2. HTTP SETTINGS
# ==========================================

http {

    include mime.types;

    default_type application/octet-stream;

    # Logs
    access_log logs/access.log;
    error_log logs/error.log warn;

    # Connection settings
    sendfile on;
    keepalive_timeout 65;


    # ======================================
    # 3. RATE LIMITING
    # ======================================

    # Authentication: 5 requests per second
    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=5r/s;

    # General APIs: 10 requests per second
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;


    # ======================================
    # 4. IDENTITY SERVICE
    # ======================================

    upstream identity_service {

        server 127.0.0.1:4001;

        keepalive 16;
    }


    # ======================================
    # 5. SECOND MICROSERVICE
    # ======================================

    upstream second_service {

        server 127.0.0.1:4002;

        keepalive 16;
    }


    # ======================================
    # 6. NGINX SERVER
    # ======================================

    server {

        listen 8080;

        server_name localhost;


        # ==================================
        # IDENTITY SERVICE HEALTH CHECK
        # ==================================

        location = /identity/health {

            proxy_pass http://identity_service/health;

            include proxy_headers.conf;
        }


        # ==================================
        # AUTHENTICATION ROUTES
        # ==================================

        location /api/auth/ {

            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }


        # ==================================
        # USER PROFILE
        # ==================================

        location = /me {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }


        # ==================================
        # VEHICLE ROUTES
        # ==================================

        location /api/vehicles/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }


        # ==================================
        # DRIVER ROUTES
        # ==================================

        location /api/drivers/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://identity_service;

            include proxy_headers.conf;
        }


        # ==================================
        # SECOND SERVICE
        # CHANGE PATH AS REQUIRED
        # ==================================

        location /api/rides/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://second_service;

            include proxy_headers.conf;
        }


        # ==================================
        # ROOT
        # ==================================

        location = / {

            return 200 "Share-Ride API Gateway is running";
        }

    }
}
